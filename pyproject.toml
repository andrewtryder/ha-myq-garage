[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = """
    --cov=custom_components/myq_garage
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=96
"""
pythonpath = ["."]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 96
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
files = ["custom_components/myq_garage"]

[[tool.mypy.overrides]]
module = [
    "homeassistant.*",
    "voluptuous.*",
    "aiohttp.*",
]
ignore_missing_imports = true
