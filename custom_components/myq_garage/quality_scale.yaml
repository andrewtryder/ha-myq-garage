rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register any service actions.
  appropriate-polling: done
  brands:
    status: done
    comment: >-
      Local brand assets are shipped under custom_components/myq_garage/brand/
      (the supported mechanism for modern custom integrations).
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >-
      Standalone HACS custom integration. The small API client and response
      models are integration-owned code shipped directly under
      custom_components/myq_garage and do not require an external dependency.
  docs-actions:
    status: exempt
    comment: Integration does not register any service actions.
  docs-conditions:
    status: exempt
    comment: Integration does not provide device automation conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration does not provide device automation triggers.
  entity-event-setup:
    status: exempt
    comment: Integration polls via the coordinator; it does not subscribe to external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not register any service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Handled by the DataUpdateCoordinator base class.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Integration is not discoverable; configuration is manual.
  discovery-update-info:
    status: exempt
    comment: Integration is not discoverable; configuration is manual.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category:
    status: exempt
    comment: >-
      Only primary garage-door cover entities are created; there are no
      config or diagnostic entities that would require an entity category.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: >-
      Only primary garage-door cover entities are created; none should be
      disabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done
