rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register any service actions.
  appropriate-polling: done
  brands:
    status: exempt
    comment: >-
      HACS-only custom integration; not submitted to the core
      home-assistant/brands repository. Local brand assets are shipped
      under custom_components/myq_garage/brand/.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: todo
    comment: >-
      The API client currently lives in-tree rather than as a separately
      published, tagged PyPI package (OSI license, public CI, matching
      releases). Extraction requires choosing a package name and
      publishing location; not yet started.
  docs-actions:
    status: exempt
    comment: Integration does not register any service actions.
  docs-conditions:
    status: exempt
    comment: Integration does not provide device automation conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration does not provide device automation triggers.
  entity-event-setup:
    status: exempt
    comment: Integration polls via the coordinator; it does not subscribe to external events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: Integration does not register any service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Handled by the DataUpdateCoordinator base class.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Integration is not discoverable; configuration is manual.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done
