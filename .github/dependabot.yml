version: 2
updates:
  # Keep GitHub Actions up-to-date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep Python test dependency inputs up-to-date.
  # After Dependabot merges a requirements_test.txt change, regenerate
  # requirements_test.lock.txt with:
  #   uv pip compile requirements_test.txt -o requirements_test.lock.txt \
  #     --python-version 3.14 --python-platform linux
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
