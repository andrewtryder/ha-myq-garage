name: Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hacs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Home Assistant Validation (hassfest)
        uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb # master

  validate-release-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check manifest version matches release-please manifest
        run: |
          set -euo pipefail
          manifest_version="$(jq -r '.version' custom_components/myq_garage/manifest.json)"
          rp_version="$(jq -r '."."' .release-please-manifest.json)"
          echo "manifest.json version=${manifest_version}"
          echo "release-please manifest version=${rp_version}"
          test "${manifest_version}" = "${rp_version}"

      - name: Ensure prospective release tag is unused
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: |
          set -euo pipefail
          version="$(jq -r '.version' custom_components/myq_garage/manifest.json)"
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "Release tag ${tag} already exists; refusing to validate a duplicate release."
            exit 1
          fi
          echo "Release tag ${tag} is available."

      - name: Smoke-check standalone HACS release layout
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT
          cp -a custom_components/myq_garage "${staging}/myq_garage"

          # Required runtime files for a standalone HACS install.
          for required in \
            __init__.py \
            client.py \
            models.py \
            config_flow.py \
            coordinator.py \
            cover.py \
            diagnostics.py \
            entity.py \
            repairs.py \
            util.py \
            const.py \
            manifest.json \
            strings.json \
            icons.json \
            quality_scale.yaml \
            translations/en.json \
            brand/icon.png
          do
            test -e "${staging}/myq_garage/${required}"
          done

          # Must not depend on repository-only packages.
          if rg -n 'myq_garage_api|myq-garage-api' "${staging}/myq_garage"; then
            echo "Standalone integration must not import repository-only packages."
            exit 1
          fi

          INTEGRATION_ROOT="${staging}/myq_garage" python - <<'PY'
          import ast
          import os
          from pathlib import Path

          root = Path(os.environ["INTEGRATION_ROOT"])
          forbidden = {"myq_garage_api"}
          for path in root.rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = {alias.name.split(".")[0] for alias in node.names}
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = {node.module.split(".")[0]}
                  else:
                      continue
                  overlap = names & forbidden
                  if overlap:
                      raise SystemExit(f"{path} imports forbidden package(s): {overlap}")
          print("Standalone release layout OK")
          PY

  validate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements_test.lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements_test.lock.txt

      - name: Run pre-commit
        run: pre-commit run --all-files
        # pre-commit is the canonical Ruff lint/format runner. The explicit
        # ruff steps below remain as a fast, non-hook regression signal when
        # someone runs the job steps individually.

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy
        run: mypy

      - name: Run Pytest
        run: PYTHONPATH=. pytest

      - name: Enforce 100% config_flow.py coverage
        run: |
          coverage report --include="*/config_flow.py" -m --fail-under=100

  validate-tests-minimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements_test.minimum.lock.txt

      - name: Install minimum Home Assistant dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements_test.minimum.lock.txt

      - name: Run Pytest against declared minimum Home Assistant
        run: PYTHONPATH=. pytest

      - name: Enforce 100% config_flow.py coverage
        run: |
          coverage report --include="*/config_flow.py" -m --fail-under=100

  validate-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download and verify actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            -o "${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar xz -f "${archive}" actionlint
          ./actionlint -version

      - name: Run actionlint
        run: ./actionlint -color

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: "false"
          online-audits: "false"

  validate-tests-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements_test.txt

      - name: Install latest dependencies (canary)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_test.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Mypy
        run: mypy

      - name: Run Pytest
        run: PYTHONPATH=. pytest

      - name: Enforce 100% config_flow.py coverage
        run: |
          coverage report --include="*/config_flow.py" -m --fail-under=100
